name: Supabase migrations

# applies new supabase/migrations/*.sql to production after they merge to master.
# history: supabase_migrations.schema_migrations (the table `supabase db push` uses). 0001-0011 are recorded.
# uses the management api over https, so only SUPABASE_ACCESS_TOKEN is needed. see .github/scripts/apply-migrations.mjs.
on:
  push:
    branches: [master]
    paths:
      - 'supabase/migrations/**'
      - '.github/scripts/apply-migrations.mjs'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'only list what would be applied'
        type: boolean
        default: true
      baseline_through:
        description: 'record versions up to this one as applied without running them (one-time, for hand-applied migrations)'
        type: string
        default: ''

permissions:
  contents: read

# never two runs against the database at once; a queued run waits instead of cancelling a live one.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: jufepgavugrbbejqdvif
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
      BASELINE_THROUGH: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_through || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: check secret
        run: test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::set the SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
      - name: apply migrations
        run: node .github/scripts/apply-migrations.mjs
