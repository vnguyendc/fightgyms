name: Scraper tests

on:
  pull_request:
    paths:
      - 'scrapers/**'
      - '.github/workflows/scraper-tests.yml'
  push:
    branches: [master, feat/jev-shadow-triage]
    paths:
      - 'scrapers/**'
      - '.github/workflows/scraper-tests.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TYPESAFE_API_KEY: ''
      TYPESAFE_MODEL: jev-1.13.0
      ANTHROPIC_API_KEY: ''
      DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.6
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -r scrapers/requirements.txt
      - run: .venv/bin/python -m unittest discover -s scrapers/tests -v
